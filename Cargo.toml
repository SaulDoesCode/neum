[package]
name = "neum"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "ordinal, reversed and byte-sum gematria over a stateful redb memory, with lists and notes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SaulDoesCode/neum"
keywords = ["gematria", "redb", "zgui", "notes"]
categories = ["gui", "text-processing"]

[lib]
name = "neum"
path = "src/lib.rs"

[[bin]]
name = "neum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
zgui = { git = "https://github.com/zortax/zgui" }
zgui-ui = { git = "https://github.com/zortax/zgui" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui" }
redb = { version = "4.4.0" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
